name: CI

# läuft bei Push auf main und bei jedem PR auf main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Name muss CI bleiben, wird beim Branch-Schutz als Status-Check eingetragen
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # wir committen unter Windows, deshalb gradlew ausführbar machen
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Die Tests brauchen weder den Core-Service noch eine Datenbank (Platzhalter-Core im Test)
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 14
