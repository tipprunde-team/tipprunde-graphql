plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mosbach'
version = '0.0.1-SNAPSHOT'

// Kompilieren für Java 17, läuft auf JDK 17 bis 25
tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	// WebClient (nicht blockierend) für den Aufruf des Core-Service
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Heroku: nur die ausführbare JAR mit festem Namen bauen (siehe Procfile)
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'tipprunde-graphql.jar'
}
