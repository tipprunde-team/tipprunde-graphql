spring.application.name=tipprunde-graphql
server.port=${PORT:8081}
# Live-URL des Core-Service, lokal läuft er auf Port 8080
app.core.base-url=${CORE_BASE_URL:http://localhost:8080}
# Wie lange der Core für eine Antwort höchstens Zeit hat (Eco-Dynos brauchen nach dem Schlafen einige Sekunden)
app.core.timeout-seconds=${CORE_TIMEOUT_SECONDS:20}
# Erlaubte Frontend-Origins für die SPA, kommagetrennt, ohne Pfad
spring.graphql.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
spring.graphql.cors.allowed-headers=Authorization,Content-Type
spring.graphql.cors.allowed-methods=POST,OPTIONS
# GraphiQL ist die Browser-Oberfläche zum Ausprobieren unter /graphiql, auf Heroku mit GRAPHIQL_ENABLED=false abschaltbar
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
management.endpoints.web.exposure.include=health
logging.level.com.mosbach.tipprunde=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%logger{20}] %msg%n
